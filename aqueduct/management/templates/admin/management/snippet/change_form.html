{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'css/admin_custom.css' %}">
  <script type="importmap">
  {
    "imports": {
      "codemirror": "https://cdn.jsdelivr.net/npm/codemirror@6.0.2/dist/index.js",
      "@codemirror/state": "https://cdn.jsdelivr.net/npm/@codemirror/state@6.7.1/dist/index.js",
      "@codemirror/view": "https://cdn.jsdelivr.net/npm/@codemirror/view@6.43.9/dist/index.js",
      "@codemirror/autocomplete": "https://cdn.jsdelivr.net/npm/@codemirror/autocomplete@6.20.3/dist/index.js",
      "@codemirror/commands": "https://cdn.jsdelivr.net/npm/@codemirror/commands@6.11.0/dist/index.js",
      "@codemirror/language": "https://cdn.jsdelivr.net/npm/@codemirror/language@6.12.4/dist/index.js",
      "@codemirror/lint": "https://cdn.jsdelivr.net/npm/@codemirror/lint@6.9.7/dist/index.js",
      "@codemirror/search": "https://cdn.jsdelivr.net/npm/@codemirror/search@6.7.1/dist/index.js",
      "@codemirror/lang-python": "https://cdn.jsdelivr.net/npm/@codemirror/lang-python@6.2.1/dist/index.js",
      "@codemirror/lang-json": "https://cdn.jsdelivr.net/npm/@codemirror/lang-json@6.0.2/dist/index.js",
      "@lezer/common": "https://cdn.jsdelivr.net/npm/@lezer/common@1.5.2/dist/index.js",
      "@lezer/highlight": "https://cdn.jsdelivr.net/npm/@lezer/highlight@1.2.3/dist/index.js",
      "@lezer/lr": "https://cdn.jsdelivr.net/npm/@lezer/lr@1.4.10/dist/index.js",
      "@lezer/python": "https://cdn.jsdelivr.net/npm/@lezer/python@1.1.19/dist/index.js",
      "@lezer/json": "https://cdn.jsdelivr.net/npm/@lezer/json@1.0.3/dist/index.js",
      "@marijn/find-cluster-break": "https://cdn.jsdelivr.net/npm/@marijn/find-cluster-break@1.0.4/src/index.js",
      "style-mod": "https://cdn.jsdelivr.net/npm/style-mod@4.1.3/src/style-mod.js",
      "w3c-keyname": "https://cdn.jsdelivr.net/npm/w3c-keyname@2.2.8/index.js",
      "crelt": "https://cdn.jsdelivr.net/npm/crelt@1.0.7/index.js"
    }
  }
  </script>
{% endblock %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    .cm-host-code {
      height: 30rem;
    }
    .cm-editor {
      height: 100%;
      width: 100%;
      max-width: none;
      border: 1px solid var(--border-color, #ccc);
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    /* Widen the code editor so it spans the full panel instead of the narrow
       default input column. */
    .module .form-row.field-code {
      width: 100%;
      max-width: none;
    }
    .module .form-row.field-code > div {
      width: 100%;
      max-width: none;
    }
    .module .form-row.field-code .flex-container {
      width: 100%;
      max-width: none;
    }
    .module .form-row.field-code .cm-host {
      width: 100% !important;
      max-width: none;
      box-sizing: border-box;
    }
    /* Make the locked `order` input read as intentionally locked, not broken. */
    .module .form-row.field-order input:disabled,
    .module .form-row.field-order input[readonly] {
      background: var(--darkened-bg, #f3f4f6);
      color: var(--body-quiet-color, #6b7280);
      border: 1px dashed var(--hairline-color, #d1d5db);
      cursor: not-allowed;
      opacity: 0.75;
    }
    .order-disabled-hint {
      margin-left: 0.5rem;
      color: var(--body-quiet-color, #6b7280);
      font-style: italic;
      font-size: 12px;
    }
  </style>
{% endblock %}

{% block admin_change_form_document_ready %}
  {{ block.super }}
  <script type="module">
    import {EditorView, basicSetup} from "codemirror";
    import {python} from "@codemirror/lang-python";

    const editors = [];
    document.querySelectorAll("textarea.snippet-code-input").forEach(function (ta) {
      const host = document.createElement("div");
      host.className = "cm-host cm-host-code";
      ta.parentNode.insertBefore(host, ta);
      const view = new EditorView({
        doc: ta.value,
        extensions: [basicSetup, python()],
        parent: host
      });
      ta.hidden = true;
      editors.push({ta: ta, view: view});
    });

    if (editors.length) {
      const form = editors[0].ta.form;
      form.addEventListener("submit", function () {
        editors.forEach(function (item) {
          item.ta.value = item.view.state.doc.toString();
        });
      });
    }
  </script>
  <script>
    // `order` only applies to plugins; lock it live when the type is config.
    // We toggle `readOnly` (not `disabled`) so the value is still submitted and
    // a plugin's order is actually saved server-side.
    (function () {
      var typeSel = document.getElementById("id_type");
      var orderInput = document.getElementById("id_order");
      if (!typeSel || !orderInput) return;
      var hint = document.createElement("span");
      hint.className = "order-disabled-hint";
      hint.textContent = "Order applies to plugins only.";
      orderInput.parentNode.appendChild(hint);
      function sync() {
        var locked = typeSel.value !== "plugin";
        orderInput.readOnly = locked;
        hint.style.display = locked ? "inline" : "none";
      }
      sync();
      typeSel.addEventListener("change", sync);
    })();
  </script>
{% endblock %}
