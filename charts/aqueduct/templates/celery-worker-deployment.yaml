apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-celery-worker
spec:
  replicas: {{ .Values.celery.workerDeployment.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      component: celery-worker
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.routerConfig | toString | sha256sum }}
        checksum/mcp-config: {{ .Values.mcpConfig | toString | sha256sum }}
        checksum/settings: {{ include (print $.Template.BasePath "/configmap-settings.yaml") . | toString | sha256sum }}
      labels:
        app: {{ .Release.Name }}
        component: celery-worker
    spec:
      serviceAccountName: {{ include "aqueduct.migrationGateName" . }}
      initContainers:
        {{- include "aqueduct.migrationGate" . | nindent 8 }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- include "aqueduct.scheduling" .Values.celery.workerDeployment | nindent 6 }}
      containers:
        - name: celery-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml .Values.celery.workerDeployment.containerSecurityContext | nindent 12 }}
          command: [ "python", "-m", "celery", "-A", "aqueduct", "worker", "--loglevel=info" ]
          env:
            {{- include "aqueduct.env" . | nindent 12 }}
            {{- include "aqueduct.databasePoolEnv" .Values.celery.workerDeployment.databasePool | nindent 12 }}
            {{- with .Values.celery.workerExtraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.celery.workerDeployment.resources | nindent 12 }}
          volumeMounts:
            - name: settings-py
              mountPath: /app/aqueduct/aqueduct/settings.py
              subPath: settings.py
            - name: router-config
              mountPath: /etc/aqueduct/router_config.yaml
              subPath: router_config.yaml
            - name: mcp-config
              mountPath: /etc/aqueduct/mcp.json
              subPath: mcp.json
      volumes:
        - name: migration-gate
          configMap:
            name: {{ include "aqueduct.migrationGateName" . }}
        - name: settings-py
          configMap:
            name: {{ .Release.Name }}-settings
        - name: router-config
          configMap:
            name: {{ .Release.Name }}-router-config
        - name: mcp-config
          configMap:
            name: {{ .Release.Name }}-mcp-config
