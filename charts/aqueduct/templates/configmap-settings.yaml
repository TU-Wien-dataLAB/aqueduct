apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-settings
data:
  settings.py: |
    {{ .Files.Get "files/settings.py" | nindent 4 }}
    LITELLM_ROUTER_CONFIG_FILE_PATH = "/etc/aqueduct/router_config.yaml"
    # Share the pod-local SQLite database between init and application containers.
    if DATABASES["default"]["ENGINE"] == "django.db.backends.sqlite3":
        DATABASES["default"]["NAME"] = "/var/lib/aqueduct/db.sqlite3"
    {{ .Values.settingsPy.extra | nindent 4 }}
    {{- if .Values.ingress.enabled }}
    SESSION_COOKIE_DOMAIN = "{{ .Values.ingress.host }}"
    {{- if .Values.ingress.tls  }}
    SECURE_SSL_REDIRECT = True
    SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')
    CSRF_COOKIE_SECURE = True
    SESSION_COOKIE_SECURE = True
    {{- end}}
    {{- end}}
