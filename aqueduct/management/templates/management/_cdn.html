{% load static %}
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.8.2" rel="stylesheet" type="text/css"/>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.17"></script>
<link href="{% static 'css/fonts.css' %}" rel="stylesheet" type="text/css"/>
<style type="text/tailwindcss">
    @theme {
        --font-sans: "Figtree Variable", "Helvetica Neue", Arial, sans-serif;
        --font-mono: "JetBrains Mono Variable", ui-monospace, Menlo, Consolas, monospace;
    }
</style>
<link href="{% static 'css/aqueduct-theme.css' %}" rel="stylesheet" type="text/css"/>
{% for theme in custom_themes %}<style data-theme-id="{{ theme.id }}" data-scheme="{{ theme.scheme }}">{{ theme.css|safe }}</style>
{% endfor %}<script src="{% static 'js/aqueduct.js' %}" data-light-theme="{{ default_themes.light }}" data-dark-theme="{{ default_themes.dark }}"></script>
