image:
  repository: ghcr.io/tu-wien-datalab/aqueduct
  tag: latest
  pullPolicy: IfNotPresent

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

collectstatic:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

migrate:
  # Init containers share their pod's scheduling; PostgreSQL lock acquisition times out after 10 minutes.
  # Migration uses the application role's environment and an unpooled connection.
  extraEnv: [] # Must remain empty; use global or role-specific extraEnv instead.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

djangoSecretKey:
  value: ""
  valueFrom:
    secretKeyRef:
      name: ""
      key: ""

oidc:
  signAlgo: "RS256"
  jwksEndpoint: ""
  authorizationEndpoint: ""
  tokenEndpoint: ""
  userEndpoint: ""
  clientId: "" # If using direct value
  clientSecret: "" # If using direct value
  # existingSecret: "" # Uncomment to use a secret
  # secretKeys:
  #   clientIdKey: ""
  #   clientSecretKey: ""


celery:
  # Extra environment variables appended to the celery worker container only.
  workerExtraEnv: []
  # Extra environment variables appended to the standalone celery beat container only.
  beatExtraEnv: []
  beatScheduling:
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  beatDatabasePool:
    minSize: 0
    maxSize: 2
  beatResources:
    requests:
      cpu: 100m
      memory: 256Mi
  beatContainerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # Celery broker URL. Leave empty to auto-derive the Valkey release
  # (redis://valkey:6379/0). Set explicitly to pin the app to an external
  # broker instead.
  brokerUrl: ""
  workerConcurrency: 1
  requestRetentionDays: 7
  schedule: "0 4 * * *"
  workerDeployment:
    replicas: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    databasePool:
      minSize: 0
      maxSize: 2
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

silk:
  enabled: true

cors:
  allowAllOrigins: true
  urlsRegex: "^/(v1/)?(completions|chat/completions|embeddings|rerank|models|audio/|images/|files|batches|responses|mcp-servers/|vector_stores)"

tos:
  enabled: false
  gatewayValidation: true

logLevel: "WARNING"

# PostgreSQL connection for the Aqueduct app. Leave `host`/`name`/`username`/
# `password` empty to auto-derive them from the CNPG cluster (`cnpg.enabled`).
# When CNPG is disabled, set `host`, `name`, `username`, and a password or
# existing Secret explicitly for the external PostgreSQL instance.
database:
  host: ""
  port: "5432"
  name: ""
  username: ""
  # Credentials: provide `password` directly, OR reference an `existingSecret`.
  # When CNPG is enabled and both are empty, the password is read from the
  # operator-created `<cluster>-app` Secret.
  password: ""
  existingSecret: ""
  secretKeys:
    password: "password"

env:
  - name: DATABASE_ENGINE
    value: "django.db.backends.postgresql"

# Set per-role PostgreSQL pool sizes using databasePool (beatDatabasePool for Beat).
# Do not set POSTGRESQL_POOL_MIN_SIZE or POSTGRESQL_POOL_MAX_SIZE in env or extraEnv.
web:
  replicas: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Set selectors to app: <release>, component: web to spread only this release.
  topologySpreadConstraints: []
  extraEnv: []
  databasePool:
    minSize: 0
    maxSize: 10
  # Initial requests, not measured capacity guarantees. Set limits after staging measurements.
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  # Set probes to null to disable.
  startupProbe:
    httpGet:
      path: /health
      port: 8000
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

settingsPy:
  extra: |
    # You can add/override settings here
    # OIDC_DEFAULT_GROUPS = ["default"]
    # ADMIN_GROUP = "default"

# Router configuration for litellm router
routerConfig: { }

# MCP configuration
mcpConfig: { }

# Files API configuration (external API for file upload and batch processing)
filesApi:
  # External API URL (required) - used for both Files and Batches API
  url: ""  # e.g., "https://api.openai.com"
  # API key for external endpoint
  apiKey: ""
  # Or use existing secret
  existingSecret: ""
  secretKeys:
    apiKey: ""

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: { }
  host: chart-example.local
  path: /
  pathType: Prefix
  tls: false
  tlsSecretName: ""

# CloudNativePG cluster (https://cloudnative-pg.io/). This is the only
# PostgreSQL backend shipped by the chart and is enabled by default. It
# requires the CNPG operator to be installed in the cluster.
cnpg:
  enabled: true
  cluster:
    nameOverride: ""       # defaults to {{ .Release.Name }}-postgres
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.2"
    instances: 1
    database: aqueduct      # bootstrap initdb database name
    owner: aqueduct         # bootstrap initdb owner (app connects as this user)
    storage:
      size: 100Gi
    resources: { }
    # Arbitrary Cluster spec fields merged on top of the template (e.g.
    # postgresql.parameters, monitoring, affinity, backup, walArchive).
    spec: { }
  # Migrate data automatically by bootstrapping the CNPG cluster from an existing
  # PostgreSQL instance via pg_basebackup, instead of running initdb. CNPG clones
  # the source at creation time and then promotes the clone to a primary, so no
  # separate dump/restore job is needed. The source must allow replication
  # connections (wal_level >= replica, a pg_hba `replication` rule, and a user
  # with REPLICATION privilege, e.g. the `postgres` superuser). Only takes effect
  # on first creation (the Cluster must not yet exist).
  bootstrapFromExternal:
    enabled: false
    name: external         # internal name referenced by pg_basebackup.source
    connection:
      # host is required when bootstrapFromExternal.enabled is true.
      host: ""
      port: ""            # defaults to "5432" if blank
      database: ""        # db to connect to for the backup, defaults to "postgres"
      username: ""        # needs REPLICATION privilege, defaults to "postgres"
      # Source password: set `password` (plaintext; a Secret is auto-created) OR
      # reference an `existingSecret`.
      password: ""
      existingSecret: ""
      secretKeys:
        password: "password"

# Valkey release (https://github.com/valkey-io/valkey-helm), a drop-in Redis
# fork. This is the only broker shipped by the chart and is enabled by default.
# Celery uses the broker only for transient task messages; set
# `celery.brokerUrl` to point at an external broker instead.
valkey:
  enabled: true
  fullnameOverride: "valkey"
  auth:
    enabled: false
  dataStorage:
    enabled: false

tika:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
