{% load i18n ui %}
<button type="button" class="btn btn-ghost btn-xs btn-square" onclick="document.getElementById('{{ dialog_id }}').showModal()" aria-label="{% blocktranslate %}Preview {{ name }}{% endblocktranslate %}" title="{% translate 'Preview' %}">{% icon "search" small=True %}</button>
<dialog id="{{ dialog_id }}" class="modal" aria-labelledby="{{ dialog_id }}-title">
    <div class="modal-box flex max-w-3xl flex-col gap-3">
        <h3 id="{{ dialog_id }}-title" class="break-all font-mono font-semibold">{{ name }}</h3>
        <pre class="max-h-80 overflow-auto rounded-field bg-base-200 p-3 font-mono text-xs">{{ text|default:_("No preview.") }}</pre>
        {% if more > 15 %}<p class="muted text-sm">{% blocktranslate with n=more|add:"-15" %}{{ n }} more lines{% endblocktranslate %}</p>{% endif %}
        <form method="dialog"><button class="btn btn-sm">{% translate "Close" %}</button></form>
    </div>
    <form method="dialog" class="modal-backdrop"><button tabindex="-1" aria-hidden="true">{% translate "Close" %}</button></form>
</dialog>
