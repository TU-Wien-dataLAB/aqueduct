{% load i18n %}{% if obj.expiration_status == "expired" %}<span class="st-err" title="{{ obj.expires_dt|date:'Y-m-d H:i' }} UTC">{% translate "Expired" %}</span>{% elif obj.expiration_status == "expiring_soon" %}<span class="st-warn" title="{{ obj.expires_dt|date:'Y-m-d H:i' }} UTC">{{ obj.expires_dt|date:"j M Y" }}</span>{% elif obj.expiration_status == "active" %}<span title="{{ obj.expires_dt|date:'Y-m-d H:i' }} UTC">{{ obj.expires_dt|date:"j M Y" }}</span>{% else %}<span class="muted">{% translate "Never" %}</span>{% endif %}
