name: Run Tests

on:
  workflow_call:

jobs:
  gateway:
    strategy:
      matrix:
        backend: [ "openai" ]
        include:
          - backend: openai
            start: "false"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.x'

      - name: Set up ruff and run `ruff check`
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0

      - name: Ruff - check imports
        run: ruff check --select I

      - name: Ruff - check formatting
        run: ruff format --check

      - name: Run mypy type check
        run: cd aqueduct && uv run mypy

      - name: Gateway Tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INTEGRATION_TEST_BACKEND: ${{ matrix.backend }}
          START_VLLM_SERVER: ${{ matrix.start }}
          DJANGO_LOG_LEVEL: WARNING
          OIDC_OP_JWKS_ENDPOINT: https://example.com/application/o/example/jwks/
        run: uv run ${{ matrix.start == 'true' && '--extra vllm' || '' }} python aqueduct/manage.py test gateway

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run docker compose
        uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4  # v3.0.0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          compose-file: "./docker-compose.yaml"
          up-flags: "--build --wait" # the wait flag checks for health status
