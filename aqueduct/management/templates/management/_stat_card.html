{% load l10n %}<div class="card bg-base-200">
    <div class="card-body gap-1">
        <span class="muted text-sm font-medium">{{ label }}</span>
        <span class="text-2xl font-semibold tabular-nums">{{ value }}</span>
        {% if note %}<span class="muted text-xs">{{ note }}</span>{% endif %}
        {% if spark %}<div class="spark mt-3">{% for bar in spark %}<span class="aq-tip-host" role="img" aria-label="{{ bar.heading }}: {{ bar.text }}"><i style="height: {{ bar.height|unlocalize }}%"></i>{% include "management/_tip.html" with heading=bar.heading total=bar.text parts=None %}</span>{% endfor %}</div>{% endif %}
    </div>
</div>
